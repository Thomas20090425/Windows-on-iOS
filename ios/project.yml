name: WindowsiOS
options:
  bundleIdPrefix: me.ammaar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WindowsiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/Resources/henge-jit.js
        buildPhase: resources
      - path: ../build/firmware/Firmware
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Prepare bundled EDK2 firmware
        script: python3 "$SRCROOT/../scripts/prepare_firmware.py"
        inputFiles:
          - $(SRCROOT)/../scripts/prepare_firmware.py
        outputFiles:
          - $(SRCROOT)/../build/firmware/Firmware/code.fd
          - $(SRCROOT)/../build/firmware/Firmware/vars-template.fd
          - $(SRCROOT)/../build/firmware/Firmware/EDK2-LICENSES.txt
          - $(SRCROOT)/../build/firmware/Firmware/README.Debian.txt
          - $(SRCROOT)/../build/firmware/Firmware/provenance.json
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Windows 11
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSMicrophoneUsageDescription: "Windows can use your microphone for live voice input and audio capture."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: WindowsiOS.entitlements
      properties:
        get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ammaar.windowsios
        PRODUCT_NAME: WindowsiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/WindowsiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/deps/include
          - $(PROJECT_DIR)/Sources/Native
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
